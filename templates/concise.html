{% extends "base.html" %}

{% block content %}
	<div class="page-inner p-0">
		<div class="container-fluid p-0 grid-container">
			<div id="row1" class="row g-0 h-50"></div>
			<div id="row2" class="row g-0 h-50"></div>
		</div>
	</div>

	<template id="column_template">
		<div class="scrollbar-inner">
			<h4 class="card-secondary">COLUMN</h4>
			<p>NOT_YET_IMPLEMENTED</p>
		</div>
	</template>

	<template id="swal_template">
		<div class="form-group">
			<div class="input-group">
			<input 
			id="feed_source"
			type="text" 
			class="form-control" 
			placeholder="Enter feed url or choose a predefined source..."
			aria-label="Text input with dropdown button" />
			<div class="input-group-append">
				<button
				class="btn btn-primary btn-border dropdown-toggle"
				type="button"
				data-bs-toggle="dropdown"
				aria-haspopup="true"
				aria-expanded="false"
				>
				Predefined
				</button>
				<div class="dropdown-menu">
					<a class="dropdown-item" href="#">Spiegel Online</a>
					<a class="dropdown-item" href="#">Zeit Online</a>
					<a class="dropdown-item" href="#">JUNGE FREIHEIT</a>
					<a class="dropdown-item" href="#">taz</a>
					<a class="dropdown-item" href="#">Handelsblatt</a>
					<a class="dropdown-item" href="#">Süddeutsche Zeitung</a>
					<a class="dropdown-item" href="#">Stern</a>
					<a class="dropdown-item" href="#">Frankfurter Allgemeine</a>
					<a class="dropdown-item" href="#">Bundesregierung</a>
					<a class="dropdown-item" href="#">t-online</a>
					<a class="dropdown-item" href="#">Tagesspiegel</a>
					<a class="dropdown-item" href="#">Focus Online</a>
				</div>
			</div>
			</div>
		</div>
	</template>
{% endblock %}
